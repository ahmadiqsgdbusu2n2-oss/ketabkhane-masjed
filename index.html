<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e594a">
<title>کتابخانه مسجد حضرت مهدی منتظر(عج)</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f0e5;color:#173d35;font-family:Tahoma,Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;background:#f8f5ec}
header{position:sticky;top:0;z-index:5;background:#0e594a;color:#fff;padding:16px 18px;box-shadow:0 2px 8px #0002}
header h1{font-size:19px;margin:0 0 5px}header small{opacity:.85}
main{padding:16px;padding-bottom:88px}.hero{background:linear-gradient(145deg,#0e594a,#174b40);color:#fff;border-radius:22px;padding:22px;margin-bottom:15px}
.hero h2{margin:0 0 7px;font-size:22px}.hero p{margin:0;opacity:.9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:17px;padding:16px;box-shadow:0 2px 10px #173d3512;border:1px solid #e6dfd0}
.stat{font-size:25px;font-weight:bold;margin-top:8px}.muted{color:#777;font-size:12px}.title{font-size:18px;font-weight:bold;margin:20px 0 10px}
button,.btn{border:0;border-radius:13px;padding:12px 15px;background:#0e594a;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#e8eee9;color:#0e594a}.full{width:100%;margin-top:10px}
input,select{width:100%;padding:13px;border:1px solid #ddd4c2;border-radius:12px;background:#fff;font-family:inherit;margin:5px 0 10px}
.row{display:flex;gap:8px}.row>*{flex:1}.item{background:#fff;border-radius:15px;padding:13px;margin:8px 0;border:1px solid #e6dfd0}
.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#dff2df;color:#246b38;font-size:11px}.bad{background:#ffe0dc;color:#a33}.warn{background:#fff0c9;color:#855d00}
nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#fff;border-top:1px solid #ddd5c5;display:flex;z-index:10}
nav button{background:none;color:#557069;border-radius:0;flex:1;padding:11px 3px;font-size:11px}nav button.active{color:#0e594a;font-weight:bold}
.hidden{display:none!important}.empty{text-align:center;color:#777;padding:30px}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:end;z-index:20}.sheet{background:#f8f5ec;width:100%;max-width:520px;margin:auto;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="app">
<header><h1>📚 کتابخانه مسجد حضرت مهدی منتظر(عج)</h1><small>سامانه مدیریت کتابخانه</small></header>
<main id="main"></main>
<nav>
<button data-page="home" class="active">⌂<br>خانه</button>
<button data-page="books">📖<br>کتاب‌ها</button>
<button data-page="members">👥<br>اعضا</button>
<button data-page="loans">🔄<br>امانت‌ها</button>
<button data-page="more">•••<br>بیشتر</button>
</nav>
</div>
<div id="modal" class="modal hidden" aria-hidden="true"><div class="sheet" id="sheet"></div></div>
<script>
const key="mosqueLibraryV1";
let db=JSON.parse(localStorage.getItem(key)||'{"books":[],"members":[],"loans":[]}');
const save=()=>localStorage.setItem(key,JSON.stringify(db));
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
const main=document.getElementById("main");
function page(p){
 document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.page===p));
 if(p==="home") home(); if(p==="books") books(); if(p==="members") members(); if(p==="loans") loans(); if(p==="more") more();
}
function home(){
 const active=db.loans.filter(x=>!x.returned).length, overdue=db.loans.filter(x=>!x.returned && new Date(x.due)<new Date()).length;
 main.innerHTML=`<div class="hero"><h2>سلام 👋</h2><p>به سامانه کتابخانه خوش آمدید</p></div>
 <div class="grid">
 <div class="card">📚<div class="stat">${db.books.length}</div><span class="muted">کل کتاب‌ها</span></div>
 <div class="card">👥<div class="stat">${db.members.length}</div><span class="muted">اعضای فعال</span></div>
 <div class="card">🔄<div class="stat">${active}</div><span class="muted">کتاب‌های امانت</span></div>
 <div class="card">⏰<div class="stat">${overdue}</div><span class="muted">دیرکرد</span></div></div>
 <div class="title">دسترسی سریع</div><div class="row">
 <button onclick="addBook()">➕ کتاب</button><button onclick="addMember()">👤 عضو</button></div>
 <button class="full secondary" onclick="addLoan()">📥 ثبت امانت جدید</button>
 <div class="title">آخرین امانت‌ها</div>${db.loans.slice(-4).reverse().map(loanItem).join("")||'<div class="empty">هنوز امانتی ثبت نشده است.</div>'}`;
}
function books(){
 main.innerHTML=`<div class="title">📖 فهرست کتاب‌ها</div>
 <input id="q" placeholder="جستجوی عنوان، نویسنده یا کد..." oninput="renderBooks()">
 <button class="full" onclick="addBook()">➕ افزودن کتاب</button><div id="bookList"></div>`;renderBooks();
}
function renderBooks(){
 const q=(document.getElementById("q")?.value||"").toLowerCase();
 const a=db.books.filter(b=>(b.title+" "+b.author+" "+b.code).toLowerCase().includes(q));
 document.getElementById("bookList").innerHTML=a.map(b=>`<div class="item"><b>${esc(b.title)}</b><br><span class="muted">${esc(b.author)} · ${esc(b.code)}</span><br><span class="badge ${b.available?'':'bad'}">${b.available?'موجود':'امانت داده شده'}</span></div>`).join("")||'<div class="empty">کتابی پیدا نشد.</div>';
}
function members(){
 main.innerHTML=`<div class="title">👥 اعضای کتابخانه</div><input id="mq" placeholder="جستجوی نام یا کد..." oninput="renderMembers()"><button class="full" onclick="addMember()">➕ افزودن عضو</button><div id="memberList"></div>`;renderMembers();
}
function renderMembers(){
 const q=(document.getElementById("mq")?.value||"").toLowerCase();
 const a=db.members.filter(m=>(m.name+" "+m.code+" "+m.phone).toLowerCase().includes(q));
 document.getElementById("memberList").innerHTML=a.map(m=>`<div class="item"><b>${esc(m.name)}</b><br><span class="muted">${esc(m.code)} · ${esc(m.phone)}</span></div>`).join("")||'<div class="empty">عضوی ثبت نشده است.</div>';
}
function loans(){
 const active=db.loans.filter(x=>!x.returned);
 main.innerHTML=`<div class="title">🔄 امانت‌ها</div><button class="full" onclick="addLoan()">📥 ثبت امانت</button>
 <div class="title">امانت‌های جاری</div>${active.map(loanItem).join("")||'<div class="empty">امانت جاری ندارید.</div>'}`;
}
function loanItem(l){
 const m=db.members.find(x=>x.code===l.member), b=db.books.find(x=>x.code===l.book), late=!l.returned&&new Date(l.due)<new Date();
 return `<div class="item"><b>${esc(b?.title||l.book)}</b><br><span class="muted">عضو: ${esc(m?.name||l.member)} · تا ${esc(l.due)}</span><br><span class="badge ${late?'bad':'warn'}">${late?'دیرکرد':'امانت'}</span>${!l.returned?` <button class="secondary" style="float:left;padding:7px 10px" onclick="returnBook('${l.id}')">ثبت برگشت</button>`:""}</div>`;
}
function more(){main.innerHTML=`<div class="title">••• بیشتر</div><div class="card"><b>امتیازات و گزارش‌ها</b><p class="muted">نسخه اول سامانه است. امکانات بیشتر را می‌توان به همین نسخه اضافه کرد.</p></div><button class="full secondary" onclick="backup()">💾 پشتیبان اطلاعات</button><button class="full" onclick="resetDemo()">🧹 پاک کردن اطلاعات آزمایشی</button>`}
function openModal(html){document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function addBook(){openModal(`<h3>افزودن کتاب</h3><input id="bt" placeholder="عنوان کتاب"><input id="ba" placeholder="نویسنده"><input id="bc" placeholder="کد کتاب، مثلا B001"><button class="full" onclick="saveBook()">ثبت کتاب</button>`)}
function saveBook(){const b={title:bt.value.trim(),author:ba.value.trim(),code:bc.value.trim(),available:true};if(!b.title||!b.code)return alert("عنوان و کد کتاب را وارد کنید.");db.books.push(b);save();closeModal();page("books")}
function addMember(){openModal(`<h3>افزودن عضو</h3><input id="mn" placeholder="نام و نام خانوادگی"><input id="mp" placeholder="شماره تماس"><input id="mc" placeholder="کد عضو، مثلا M001"><button class="full" onclick="saveMember()">ثبت عضو</button>`)}
function saveMember(){const m={name:mn.value.trim(),phone:mp.value.trim(),code:mc.value.trim()};if(!m.name||!m.code)return alert("نام و کد عضو را وارد کنید.");db.members.push(m);save();closeModal();page("members")}
function addLoan(){
 if(!db.members.length||!db.books.filter(b=>b.available).length)return alert("ابتدا حداقل یک عضو و یک کتاب موجود ثبت کنید.");
 openModal(`<h3>📥 ثبت امانت</h3><label>عضو</label><select id="lm">${db.members.map(m=>`<option value="${esc(m.code)}">${esc(m.name)} — ${esc(m.code)}</option>`).join("")}</select><label>کتاب</label><select id="lb">${db.books.filter(b=>b.available).map(b=>`<option value="${esc(b.code)}">${esc(b.title)} — ${esc(b.code)}</option>`).join("")}</select><label>موعد برگشت</label><input id="ld" type="date"><button class="full" onclick="saveLoan()">ثبت امانت</button>`);ld.value=new Date(Date.now()+7*864e5).toISOString().slice(0,10)
}
function saveLoan(){const b=db.books.find(x=>x.code===lb.value);const l={id:Date.now().toString(),member:lm.value,book:lb.value,due:ld.value,returned:false};db.loans.push(l);b.available=false;save();closeModal();page("loans")}
function returnBook(id){const l=db.loans.find(x=>x.id===id);if(!l)return;l.returned=true;l.returnDate=new Date().toISOString().slice(0,10);const b=db.books.find(x=>x.code===l.book);if(b)b.available=true;save();page("loans")}
function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="کتابخانه-مسجد-پشتیبان.json";a.click()}
function resetDemo(){if(confirm("تمام اطلاعات ذخیره‌شده روی این گوشی پاک شود؟")){localStorage.removeItem(key);db={books:[],members:[],loans:[]};page("home")}}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>page(b.dataset.page));
page("home");
</script>
</body>
</html>
